name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The app targets iOS 26.5, which needs Xcode 26. Resolve whatever the
      # runner image ships rather than hard-coding an app path.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # GitHub's macOS runner images don't always ship the iOS Simulator
      # runtime pre-downloaded for the newest Xcode — only what shipped with
      # the image (e.g. visionOS). Without this, -destination can't resolve
      # any concrete iOS Simulator device and the test step fails.
      - name: Ensure iOS Simulator runtime is installed
        run: |
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes

      # Downloading the runtime only installs the "engine" — it doesn't create
      # any concrete simulator device. The default device set is normally
      # created the first time Xcode/Simulator.app fully launches, which
      # doesn't happen for a non-default Xcode install on a CI runner. So the
      # device we test against has to be created explicitly.
      #
      # Python helpers live in separate files (rather than inline `python3 -c`)
      # so their indentation doesn't have to fight the YAML block scalar's.
      - name: Write simulator setup helper scripts
        run: |
          mkdir -p .ci
          cat > .ci/latest_ios_runtime.py <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          ios = [r for r in data['runtimes'] if r['platform'] == 'iOS' and r.get('isAvailable', True)]
          if not ios:
              sys.exit('No available iOS runtimes found')
          latest = sorted(ios, key=lambda r: r['version'])[-1]
          print(latest['identifier'])
          PY
          cat > .ci/iphone17_device_type.py <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          match = [d for d in data['devicetypes'] if d['name'] == 'iPhone 17']
          if not match:
              sys.exit('iPhone 17 device type not found on this Xcode install')
          print(match[0]['identifier'])
          PY

      - name: Create iPhone 17 simulator device
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 .ci/latest_ios_runtime.py)
          echo "Using runtime: $RUNTIME_ID"
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 .ci/iphone17_device_type.py)
          echo "Using device type: $DEVICE_TYPE_ID"
          xcrun simctl create "iPhone 17" "$DEVICE_TYPE_ID" "$RUNTIME_ID"
          xcrun simctl list devices available

      - name: Build and test
        run: |
          xcodebuild test \
            -project LettuceDecide.xcodeproj \
            -scheme LettuceDecide \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
